canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}#hint{position:absolute;top:14px;left:18px;pointer-events:none;line-height:1.8}

<script>
const add=(a,b)=>a.map((x,i)=>x+b[i]),sub=(a,b)=>a.map((x,i)=>x-b[i]),mul=(a,k)=>a.map(x=>x*k),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),norm=a=>Math.hypot(...a),unit=a=>mul(a,1/(norm(a)||1)),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
window.Physics={add,sub,mul,dot,norm,unit,cross};
</script><script src="qrc:///qtwebchannel/qwebchannel.js"></script><script src="gpu-renderer.js"></script><script src="scene.js"></script></html>
